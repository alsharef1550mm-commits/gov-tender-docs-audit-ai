<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750" y="65.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#17324D" direction="rtl">دورة المراجع من رفع الملف إلى التقرير</text><rect x="180" y="130" width="1140" height="115" rx="16" fill="#F4F8FC" stroke="#2563EB" stroke-width="2"/><rect x="180" y="130" width="7" height="115" rx="3" fill="#2563EB"/><text x="750.0" y="170.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#2563EB" direction="rtl">تجهيز الملف</text><text x="750.0" y="210.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">تصحيح اتجاه الصفحات عند الحاجة قبل الرفع</text><path d="M750 245V280" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)" /><rect x="180" y="295" width="1140" height="115" rx="16" fill="#F4F8FC" stroke="#2563EB" stroke-width="2"/><rect x="180" y="295" width="7" height="115" rx="3" fill="#2563EB"/><text x="750.0" y="335.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#2563EB" direction="rtl">بدء الفحص</text><text x="750.0" y="375.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">رفع العقد والربطات ثم متابعة التقدم أو الإلغاء</text><path d="M750 410V445" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)" /><rect x="180" y="460" width="1140" height="115" rx="16" fill="#F4F8FC" stroke="#B45309" stroke-width="2"/><rect x="180" y="460" width="7" height="115" rx="3" fill="#B45309"/><text x="750.0" y="500.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#B45309" direction="rtl">مراجعة الإحالة</text><text x="750.0" y="540.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">عرض السند مع فاتورته وتعميده وسبب الملاحظة</text><path d="M750 575V610" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow)" /><rect x="180" y="625" width="1140" height="115" rx="16" fill="#F4F8FC" stroke="#B45309" stroke-width="2"/><rect x="180" y="625" width="7" height="115" rx="3" fill="#B45309"/><text x="750.0" y="665.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#B45309" direction="rtl">توثيق القرار</text><text x="750.0" y="705.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">سليم أو فيه مشكلة؛ مع ملاحظة واسم المراجع</text><path d="M750 740V775" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow)" /><rect x="180" y="790" width="1140" height="115" rx="16" fill="#F4F8FC" stroke="#0F766E" stroke-width="2"/><rect x="180" y="790" width="7" height="115" rx="3" fill="#0F766E"/><text x="750.0" y="830.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F766E" direction="rtl">إصدار التقرير</text><text x="750.0" y="870.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">بناء التقرير من القراءة المحفوظة بالقالب المعتمد</text></svg>