<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750" y="65.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="38" font-weight="700" fill="#17324D" direction="rtl">من الملاحظة إلى قرار مراجعة موثق</text><rect x="90" y="130" width="560" height="145" rx="16" fill="#F4F8FC" stroke="#2563EB" stroke-width="2"/><rect x="90" y="130" width="7" height="145" rx="3" fill="#2563EB"/><text x="370.0" y="170.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#2563EB" direction="rtl">قيمة مطبوعة في المستند</text><text x="370.0" y="210.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">يحفظ النظام القراءة ودليل صفحتها</text><text x="370.0" y="244.1" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">ويفصلها عن القيمة المحسوبة</text><rect x="850" y="130" width="560" height="145" rx="16" fill="#F4F8FC" stroke="#0F766E" stroke-width="2"/><rect x="850" y="130" width="7" height="145" rx="3" fill="#0F766E"/><text x="1130.0" y="170.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F766E" direction="rtl">قيمة محسوبة وفق العقد</text><text x="1130.0" y="210.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">كمية × سعر ثم العمولة والضريبة</text><text x="1130.0" y="244.1" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">والغرامة عند تحقق شروطها</text><path d="M650 200H830" fill="none" stroke="#17324D" stroke-width="3" marker-end="url(#arrow)" /><rect x="380" y="365" width="740" height="145" rx="16" fill="#F4F8FC" stroke="#B45309" stroke-width="2"/><rect x="380" y="365" width="7" height="145" rx="3" fill="#B45309"/><text x="750.0" y="405.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#B45309" direction="rtl">اختلاف أو نقص دليل</text><text x="750.0" y="445.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">قد يكون خطأ مستند أو خطأ قراءة</text><text x="750.0" y="479.1" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">لا يُحسم النوع من التعارض وحده</text><path d="M370 275V320H750V350" fill="none" stroke="#17324D" stroke-width="3" marker-end="url(#arrow)" /><path d="M1130 275V320H750" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)" /><rect x="90" y="620" width="560" height="170" rx="16" fill="#F4F8FC" stroke="#0F766E" stroke-width="2"/><rect x="90" y="620" width="7" height="170" rx="3" fill="#0F766E"/><text x="370.0" y="660.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F766E" direction="rtl">المراجع يؤكد صحة المصدر</text><text x="370.0" y="700.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">يسجل قراره وملاحظته واسمه</text><text x="370.0" y="734.1" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">ويتحقق من أثر القرار في التقرير</text><rect x="850" y="620" width="560" height="170" rx="16" fill="#F4F8FC" stroke="#B42338" stroke-width="2"/><rect x="850" y="620" width="7" height="170" rx="3" fill="#B42338"/><text x="1130.0" y="660.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#B42338" direction="rtl">المراجع يؤكد وجود مشكلة</text><text x="1130.0" y="700.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">لا يُصرف السند المتأثر قبل المعالجة</text><text x="1130.0" y="734.1" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="400" fill="#17324D" direction="rtl">تُحفظ الملاحظة مع مستنداتها</text><path d="M570 510V560H370V605" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)" /><path d="M930 510V560H1130V605" fill="none" stroke="#B42338" stroke-width="3" marker-end="url(#arrow)" /><text x="750" y="875.0" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="25" font-weight="400" fill="#17324D" direction="rtl">إحالة صحيحة بسبب خطأ فعلي دليل على عمل الرقابة؛ وليست فشلًا في القراءة بالضرورة</text></svg>